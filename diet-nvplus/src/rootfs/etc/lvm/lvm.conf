devices {
    dir = "/dev"
    scan = [ "/dev" ]
    filter = [ "a|^/dev/md[2-9]$|", "r|.*|" ]
    cache = "/etc/lvm/.cache"
    write_cache_state = 1
    sysfs_scan = 1
    md_component_detection = 1
}
backup {
    backup = 0
    archive = 0
}
global {
    locking_type = 1
    locking_dir = "/var/lock/lvm"
}
