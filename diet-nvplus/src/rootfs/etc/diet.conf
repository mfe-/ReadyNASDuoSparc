# DIET Hardware-Einstellungen (ReadyNAS NV+ v1)
SPINDOWN_MIN=30        # Platten-Standby nach x Minuten Ruhe (0 = aus)
FAN_PWM_MIN=40         # Luefter-Grundstufe (0..255), bis TEMP_LOW
FAN_PWM_MAX=255
TEMP_LOW=40            # Board-Temperatur: darunter Grundstufe
TEMP_HIGH=55           # ab hier volle Drehzahl
TEMP_CRIT=62           # Board: Notabschaltung
DISK_HIGH=50           # Plattentemperatur: ab hier volle Drehzahl
DISK_CRIT=62           # Platte: Notabschaltung
LCD_TIMEOUT=120        # Display-Beleuchtung nach x Sekunden aus (0 = immer an)
