name: Build SPARC binaries

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sparc:
    # Change these three inputs for another project. '.' copies the repo root;
    # artifact_paths selects outputs relative to /root/ci-build in the guest.
    uses: ./.github/workflows/sparc-build.yml
    with:
      source_directory: diet-nvplus/tools
      build_command: |
        uname -m
        gcc --version
        gcc -O2 -mcpu=v7 -o sdiv-test sdiv-test.c
        ls -lh sdiv-test
        ./sdiv-test 0
      artifact_paths: sdiv-test

  consume:
    needs: sparc
    runs-on: ubuntu-22.04
    steps:
      # The reusable job uploads this named artifact in the same workflow run.
      # Download it before using generated files; this job has its own filesystem.
      - name: Retrieve SPARC build output
        uses: actions/download-artifact@v4
        with:
          name: readynas-sparc-build
          path: build-output

      - name: Verify returned binary
        run: |
          set -euo pipefail
          test -s build-output/sdiv-test
          file build-output/sdiv-test
          readelf -h build-output/sdiv-test
          sha256sum build-output/sdiv-test
          readelf -h build-output/sdiv-test | grep -Eiq 'Machine:.*sparc'
